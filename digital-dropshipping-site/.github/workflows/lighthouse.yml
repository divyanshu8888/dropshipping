name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: digital-dropshipping-site/package-lock.json
      
      - name: Install dependencies
        working-directory: digital-dropshipping-site
        run: npm ci
      
      - name: Build application
        working-directory: digital-dropshipping-site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      
      - name: Start Next.js server
        working-directory: digital-dropshipping-site
        run: |
          npm start &
          sleep 10
      
      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli@latest autorun --upload.target=temporary-public-storage
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      
      # Or use lighthouserc.json for configuration
      # - name: Run Lighthouse CI
      #   run: npx @lhci/cli@latest autorun

