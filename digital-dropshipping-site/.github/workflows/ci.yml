name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: digital-dropshipping-site/package-lock.json
      
      - name: Install dependencies
        working-directory: digital-dropshipping-site
        run: npm ci
      
      - name: Run ESLint
        working-directory: digital-dropshipping-site
        run: npm run lint
      
      - name: Run TypeScript check
        working-directory: digital-dropshipping-site
        run: npm run typecheck
      
      - name: Run tests
        working-directory: digital-dropshipping-site
        run: npm test --if-present
      
      - name: Build project
        working-directory: digital-dropshipping-site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

